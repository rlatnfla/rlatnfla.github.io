# 기본 블로그 정보
title: title
tagline: 개발 기록
description: >-
  description
url: "https://rlatnfla.github.io"

# 작성자 정보
author: rlatnfla
email: rlatnfla0724@gmail.com
github_username: rlatnfla

# 테마 및 언어 설정
theme: jekyll-theme-chirpy
lang: ko
timezone: Asia/Seoul

# 레이아웃 및 기능 설정
toc: true

# Jekyll 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 빌드외 대상 파일/폴더
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 페이지네이션 설정
paginate: 10
paginate_path: "/page:num/"

# Chirpy 전용 자바스크립트/애셋 CDNs 설정 활성화
assets:
  self_host:
    enabled: true

# giscus 댓글 설정
comments:
  provider: giscus
  giscus:
    repo: rlatnfla/rlatnfla.github.io
    repo_id: "R_kgDORnlMhA"
    category: "Announcements"
    category_id: "DIC_kwDORnlMhM4DG3JJ"
    mapping: pathname
    strict: 1
    input_position: bottom
    lang: ko